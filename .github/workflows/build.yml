name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal, macOS 10.15+)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build
        run: cmake --build build --config Release --target Scope_VST3 Scope_AU Scope_Standalone -- -quiet
      - name: Verify binaries run on macOS 11 (universal, minos <= 11.0)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            minos=$(otool -arch all -l "$f" | awk '/LC_BUILD_VERSION/{m=1} /LC_VERSION_MIN_MACOSX/{v=1} m&&$1=="minos"{print $2; m=0} v&&$1=="version"{print $2; v=0}' | sort -V | tail -1)
            archs=$(lipo -archs "$f")
            echo "$f -> minos $minos, archs $archs"
            [ -n "$minos" ] && [ "$(printf '%s\n11.0\n' "$minos" | sort -V | tail -1)" = "11.0" ] || { echo "::error::$f needs macOS $minos"; fail=1; }
            case " $archs " in *x86_64*) ;; *) echo "::error::$f has no Intel slice"; fail=1;; esac
            case " $archs " in *arm64*) ;; *) echo "::error::$f has no Apple Silicon slice"; fail=1;; esac
          done < <(find build -path '*_artefacts/Release/*' -path '*/Contents/MacOS/*' -type f -print0)
          exit $fail
      - name: Check binaries
        run: |
          ART=build/Scope_artefacts/Release
          lipo -info "$ART/VST3/Scope.vst3/Contents/MacOS/Scope"
          otool -l "$ART/VST3/Scope.vst3/Contents/MacOS/Scope" | grep -A3 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -8
      - name: Ad-hoc sign bundles
        run: |
          ART=build/Scope_artefacts/Release
          for b in "$ART/VST3/Scope.vst3" "$ART/AU/Scope.component" "$ART/Standalone/Scope.app"; do
            codesign --force --deep --sign - "$b"
          done
      - name: Make .dmg installer
        run: packaging/mac/make_installer.sh build/Scope_artefacts/Release "$(grep -m1 -oE 'VERSION [0-9.]+' CMakeLists.txt | cut -d' ' -f2)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: Scope-mac
          path: dist/*.dmg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target Scope_VST3 Scope_Standalone
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Make Setup.exe
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION ([0-9.]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $art = Resolve-Path build/Scope_artefacts/Release
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = Resolve-Path dist
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DArtefacts=$art" "/DOutDir=$out" packaging/windows/Scope.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Scope-windows
          path: dist/*.exe

  release:
    # Publishes the installers to a GitHub Release named after the CMake project version
    # on every successful build of main (and on v* tags). Re-runs replace the files.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(grep -m1 -oE 'project\([^)]*VERSION [0-9.]+' CMakeLists.txt | grep -oE '[0-9.]+$')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Installers built by GitHub Actions from ${{ github.sha }}.
            macOS: universal (Intel + Apple Silicon), macOS 11 or later. Unsigned: right-click the .pkg and choose Open.
            Windows: 64-bit Setup.exe (VST3 goes to Common Files\VST3).
          files: dist/*
          overwrite_files: true
